openapi: 3.0.0
info:
  title: Bosch Smart Home Local API for Thermostat Regulation Algorithm
  description: |-
    This description focuses on the JSON-based, REST-like API for reading and
    changing the regulation algorithm of a thermostat-capable Device.

    Not every Device advertises this capability; Devices without it respond
    with `404`.

    This is not part of the generated device/service model and is not
    covered by the official OpenAPI generator output; it was traced from the
    official Bosch Android app and confirmed against a real Bosch Smart Home
    Controller (all real thermostats/valves available for testing correctly
    responded `404` - none of them support this endpoint).

    By using this documentation, the developer accepts and agrees to be bound by our [Terms and Conditions](https://github.com/BoschSmartHome/bosch-shc-api-docs#terms-and-conditions).

    This documentation is subject to the [Creative Commons Attribution-NonCommercial-NoDerivatives 4.0 International Public License](https://creativecommons.org/licenses/by-nc-nd/4.0/legalcode).

    Please report any issues you encounter with this documentation in our [GitHub tracker](https://github.com/BoschSmartHome/bosch-shc-api-docs/issues).
  version: "1.0"
servers:
  - url: https://{shcIp}:8444/smarthome
    description: "Bosch Smart Home Controller URL"
    variables:
      shcIp:
        default: 192.168.0.10
tags:
  - name: Configuration
    description: Configuration of a thermostat's regulation algorithm.
paths:
  '/thermostat/regulation/{deviceId}/config':
    get:
      summary: Get a thermostat's regulation-algorithm configuration.
      description: |-
        Returns the regulation-algorithm configuration of the Device
        identified by the `deviceId` path parameter. Devices without this
        capability respond with `404`.
      tags:
        - Configuration
      parameters:
        - $ref: '#/components/parameters/apiVersionHeaderParam'
        - $ref: '#/components/parameters/deviceIdPathParam'
      responses:
        '200':
          description: The regulation-algorithm configuration was successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThermostatRegulationConfig'
        '404':
          description: |-
            The entity could not be found. Either the `deviceId` path parameter
            was invalid, or the Device has no regulation-algorithm capability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvancedError'
    put:
      summary: Update a thermostat's regulation-algorithm configuration.
      description: |-
        Updates the regulation-algorithm configuration of the Device
        identified by the `deviceId` path parameter with a full-body PUT
        (`id` plus the desired `algorithmUsed`).
      tags:
        - Configuration
      parameters:
        - $ref: '#/components/parameters/apiVersionHeaderParam'
        - $ref: '#/components/parameters/deviceIdPathParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThermostatRegulationConfig'
      responses:
        '200':
          description: Accepted request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThermostatRegulationConfig'
        '404':
          description: |-
            The entity could not be found. Either the `deviceId` path parameter
            was invalid, or the Device has no regulation-algorithm capability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvancedError'
components:
  schemas:
    AdvancedError:
      type: object
      properties:
        '@type':
          type: string
          description: The type of the Object.
          example: JsonRestExceptionResponseEntity
        errorCode:
          type: string
          description: The error code of the occurred Exception.
        statusCode:
          type: integer
          description: The HTTP status of the error.
    ThermostatRegulationConfig:
      type: object
      properties:
        id:
          type: string
          description: "A single fully qualified identifier of the Device."
        algorithmUsed:
          type: string
          description: The regulation algorithm currently used by the thermostat.
          enum:
            - INTERNAL
            - CUSTOM
  parameters:
    apiVersionHeaderParam:
      in: header
      name: api-version
      description: The version of the API.
      schema:
        type: string
        example: "1.0"
    deviceIdPathParam:
      name: deviceId
      in: path
      description: "A single fully qualified identifier of the Device."
      required: true
      schema:
        type: string
